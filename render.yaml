services:
  - type: web
    name: qsl-tracker
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      # Gmail credentials for the "Request a QSL Card" email notification
      # (see mailer.py / README) -- sync: false means Render will prompt
      # for these in the dashboard instead of storing real values here.
      - key: GMAIL_ADDRESS
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: NOTIFY_EMAIL
        sync: false
