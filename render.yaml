services:
  - type: web
    name: qsl-tracker
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # One worker: the log is a single JSON object, and overlapping saves
    # are retried via S3 If-Match, but a second worker is not useful on
    # the free plan. Timeout 120 so a sync is not killed mid-page (the
    # app still stops itself well inside that). Do not drop --workers 1
    # if you change this command.
    startCommand: gunicorn app:app --workers 1 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      # Resend API credentials for the "Request a QSL Card" email
      # notification (see mailer.py / README) -- sync: false means
      # Render will prompt for these in the dashboard instead of
      # storing real values here. Switched from Gmail SMTP to Resend's
      # HTTP API on 2026-08-21 because Render's free plan blocks
      # outbound SMTP (both port 465 and 587 timed out).
      - key: RESEND_API_KEY
        sync: false
      - key: NOTIFY_EMAIL
        sync: false
      # QSL Photo Map (s3.py) -- S3_BUCKET/AWS_REGION aren't secret, so
      # they're set directly here. AWS credentials and the admin
      # password are secrets -- sync: false prompts for them in the
      # Render dashboard instead of storing them in the repo. The IAM
      # user behind those keys needs s3:PutObject, s3:GetObject, and
      # s3:DeleteObject scoped to this bucket's photocards/* prefix,
      # plus s3:ListBucket -- see README. DeleteObject is what removes
      # a photo when a card is edited or deleted.
      - key: S3_BUCKET
        value: kn0ble-qsl-381999184691-us-east-2-an
      - key: AWS_REGION
        value: us-east-2
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # QRZ.com -> Logbook -> Settings -> API. Sync from QRZ does nothing
      # without it. sync: false prompts in the dashboard and does not
      # overwrite a value already saved there.
      - key: QRZ_LOGBOOK_API_KEY
        sync: false
