# Self-hosting setup for Unraid (or any Docker host). See the
# "Self-hosting on Unraid" section in README.md for the full walkthrough
# -- this file alone won't make sense without it (nginx config, DNS
# change, where to put the .env file, etc).
services:
  qsl-tracker:
    build: .
    container_name: qsl-tracker
    restart: unless-stopped
    # host:container -- change 8010 if that host port is already taken
    # on your Unraid box. nginx's proxy_pass should point at whichever
    # host port you pick here (see README).
    ports:
      - "8010:8000"
    # Persists the SQLite database across container recreates/updates --
    # this is the entire point of self-hosting instead of staying on
    # Render's free plan. Point this at a real path on your array, e.g.
    # /mnt/user/appdata/qsl-tracker/instance -- Unraid will create it if
    # it doesn't exist yet.
    volumes:
      - /mnt/user/appdata/qsl-tracker/instance:/app/instance
    env_file:
      - .env
