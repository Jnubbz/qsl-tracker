{% extends "base.html" %}
{% block title %}QSL Photo Map{% endblock %}

{% block extra_head %}
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
{% endblock %}

{% block content %}
  <section class="card">
    <h1>QSL Photo Map</h1>
    <p class="muted">Scanned QSL cards, plotted by station. Click a pin to see the card.</p>
    <div id="map"></div>
  </section>

  <section class="card" id="detail-card" style="display:none;">
    <h1 id="detail-callsign"></h1>
    <p id="detail-location" class="muted"></p>
    <div id="detail-cards"></div>
  </section>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script>
  (function () {
    var map = L.map('map').setView([20, 0], 2);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 18,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
    }).addTo(map);

    var clusters = L.markerClusterGroup();
    var cache = {}; // callsign -> already-fetched detail JSON, so re-clicking a pin doesn't re-fetch

    fetch('{{ url_for("photomap_api_pins") }}')
      .then(function (r) { return r.json(); })
      .then(function (data) {
        var pins = data.pins || [];
        pins.forEach(function (pin) {
          var marker = L.marker([pin.lat, pin.lon]);
          marker.bindTooltip(pin.callsign + (pin.card_count > 1 ? ' (' + pin.card_count + ')' : ''));
          marker.on('click', function () { onPinClick(pin.callsign, marker); });
          clusters.addLayer(marker);
        });
        map.addLayer(clusters);
        if (pins.length) {
          map.fitBounds(clusters.getBounds(), { maxZoom: 6, padding: [20, 20] });
        }
      });

    function onPinClick(callsign, marker) {
      if (cache[callsign]) {
        openPopup(cache[callsign], marker);
        renderDetail(cache[callsign]);
        return;
      }
      var url = '{{ url_for("photomap_api_callsign") }}?callsign=' + encodeURIComponent(callsign);
      fetch(url)
        .then(function (r) { return r.json(); })
        .then(function (data) {
          cache[callsign] = data;
          openPopup(data, marker);
          renderDetail(data);
        });
    }

    // Shows the card's photo right at the pin -- the quickest way to see
    // it without scrolling. Just the first photo (of the first card) as
    // a thumbnail; anything beyond that is in the detail panel below.
    function openPopup(data, marker) {
      var box = document.createElement('div');
      box.className = 'photomap-popup';

      var title = document.createElement('strong');
      title.textContent = data.callsign;
      box.appendChild(title);

      var loc = [data.state, data.country].filter(Boolean).join(', ');
      if (loc) {
        var locEl = document.createElement('div');
        locEl.className = 'muted';
        locEl.textContent = loc;
        box.appendChild(locEl);
      }

      var cards = data.cards || [];
      var firstImage = cards.length && cards[0].images && cards[0].images[0];
      if (firstImage) {
        var link = document.createElement('a');
        link.href = firstImage;
        link.target = '_blank';
        link.rel = 'noopener';
        var img = document.createElement('img');
        img.src = firstImage;
        img.alt = data.callsign + ' QSL card';
        img.className = 'photomap-popup-img';
        link.appendChild(img);
        box.appendChild(link);
      } else {
        var none = document.createElement('div');
        none.className = 'muted';
        none.textContent = 'No photo on file.';
        box.appendChild(none);
      }

      var totalImages = cards.reduce(function (n, c) { return n + ((c.images && c.images.length) || 0); }, 0);
      if (totalImages > 1) {
        var more = document.createElement('div');
        more.className = 'muted';
        more.textContent = totalImages + ' photos total -- see all below';
        box.appendChild(more);
      }

      marker.bindPopup(box, { maxWidth: 260 }).openPopup();
    }

    // Full gallery -- every card and every photo for this callsign,
    // below the map, for when there's more than the popup's one preview.
    function renderDetail(data) {
      var detail = document.getElementById('detail-card');
      document.getElementById('detail-callsign').textContent = data.callsign;
      document.getElementById('detail-location').textContent = [data.state, data.country].filter(Boolean).join(', ');

      var container = document.getElementById('detail-cards');
      container.innerHTML = '';
      (data.cards || []).forEach(function (card) {
        var block = document.createElement('div');
        block.className = 'photomap-entry';

        var meta = [card.qso_date, card.band, card.mode, card.freq ? card.freq + ' MHz' : '']
          .filter(Boolean).join(' · ');
        var metaEl = document.createElement('p');
        metaEl.className = 'muted';
        metaEl.textContent = meta || 'No QSO details recorded';
        block.appendChild(metaEl);

        if (card.note) {
          var noteEl = document.createElement('p');
          noteEl.textContent = card.note;
          block.appendChild(noteEl);
        }

        (card.images || []).forEach(function (imgUrl) {
          var img = document.createElement('img');
          img.src = imgUrl;
          img.alt = data.callsign + ' QSL card';
          img.className = 'photomap-img';
          block.appendChild(img);
        });

        container.appendChild(block);
      });

      detail.style.display = 'block';
    }
  })();
  </script>
{% endblock %}
